<div class="page">
    <div class="title">
        <h2>Transactions</h2>
        <div>
            <select (change)="filterBy($event)">
                <option selected="true" disabled="disabled">Filter by accounts</option>
                <option value="0">All Accounts</option>
                @for (account of accounts(); track account.id) 
                {
                    <option [value]="account.id">{{account.name}}</option>
                }
            </select>
        </div>
    </div>
    <div class="main">
        @for (transaction of transactions(); track transaction.id) 
        {
            <div class="calendar">
                <div class="date">
                     <div class="line"></div>
                    <div class="box">
                        <div class="header">{{ transaction.transactedAt.monthShort}}</div>
                        <div class="date"> {{transaction.transactedAt.datePadded }} </div>
                    </div>
                    <div class="line"></div>
                </div>
                <div class="content">
                    <div class="horizon"></div>
                    <div class="card">
                        <h2>{{ transaction.payee }}</h2>
                        <h4> {{ transaction.description }} </h4>
                        <div [ngClass]="transaction.amount > 0 ? 'positive' : 'negative'">
                            {{ formatter.format(transaction.amount) }}
                        </div>
                    </div>
                </div>
            </div>
        }
    </div>
</div>
